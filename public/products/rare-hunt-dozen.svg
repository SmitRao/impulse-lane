<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce7f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad2)"/>
  <!-- Box outline -->
  <rect x="30" y="50" width="140" height="100" rx="10" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
  <rect x="35" y="55" width="130" height="90" rx="8" fill="#fffbeb"/>
  <!-- Grid of dumplings (3x4) -->
  <circle cx="55" cy="75" r="12" fill="#fff5e6" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="85" cy="75" r="12" fill="#fff5e6" stroke="#fb7185" stroke-width="1.5"/>
  <circle cx="115" cy="75" r="12" fill="#fff5e6" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="145" cy="75" r="12" fill="#fff5e6" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="55" cy="100" r="12" fill="#fff5e6" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="85" cy="100" r="12" fill="#fff5e6" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="115" cy="100" r="12" fill="#fff5e6" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="145" cy="100" r="12" fill="#fff5e6" stroke="#fb7185" stroke-width="1.5"/>
  <circle cx="55" cy="125" r="12" fill="#fff5e6" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="85" cy="125" r="12" fill="#fff5e6" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="115" cy="125" r="12" fill="#fff5e6" stroke="#60a5fa" stroke-width="1.5"/>
  <!-- RARE dumpling with star -->
  <circle cx="145" cy="125" r="12" fill="#fef08a" stroke="#eab308" stroke-width="2"/>
  <text x="145" y="128" text-anchor="middle" font-size="10" fill="#ca8a04"></text>
  <!-- Badge -->
  <rect x="120" y="40" width="60" height="20" rx="10" fill="#eab308"/>
  <text x="150" y="54" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff" font-weight="bold">1 RARE!</text>
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#78716c">×12 Pack</text>

  <text x="100" y="144" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1A1A1A">×8</text>
  
  <!-- Age badge -->
  <rect x="130" y="125" width="45" height="20" rx="10" fill="#7C5CFF"/>
  <text x="152" y="140" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#FFFFFF">14+</text>

  <!-- Sparkles -->
  <g fill="#FFE566" opacity="0.9">
    <polygon points="170,15 172,21 178,21 173,25 175,31 170,27 165,31 167,25 162,21 168,21"/>
    <polygon points="20,110 22,116 28,116 23,120 25,126 20,122 15,126 17,120 12,116 18,116" transform="scale(0.7) translate(5,5)"/>
  </g>
  
  <!-- Pack label -->

  <g transform="translate(25, 40)">
    <ellipse cx="0" cy="0" rx="18" ry="15" fill="url(#smile1)"/>
    <ellipse cx="0" cy="-5" rx="12" ry="4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-5" cy="-2" r="2" fill="#1A1A1A"/>
    <circle cx="5" cy="-2" r="2" fill="#1A1A1A"/>
    <path d="M-6,4 Q0,10 6,4" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  </g>
  
  <g transform="translate(65, 35)">
    <ellipse cx="0" cy="0" rx="18" ry="15" fill="url(#smile2)"/>
    <ellipse cx="0" cy="-5" rx="12" ry="4" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="-5" cy="-2" r="2" fill="#1A1A1A"/>
    <circle cx="5" cy="-2" r="2" fill="#1A1A1A"/>
    <path d="M-6,4 Q0,10 6,4" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  </g>
  
  <g transform="translate(105, 35)">

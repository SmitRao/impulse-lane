<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="grad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e0e7ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fce7f3;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" fill="url(#grad4)"/>
  <!-- Party sleeve/envelope -->
  <rect x="20" y="60" width="160" height="90" rx="5" fill="#fff" stroke="#e5e7eb" stroke-width="2"/>
  <rect x="25" y="65" width="150" height="80" fill="#fefce8"/>
  <!-- Window -->
  <rect x="35" y="75" width="130" height="50" rx="3" fill="#fff" stroke="#d1d5db" stroke-width="1"/>
  <!-- 8 dumplings in 2 rows -->
  <circle cx="50" cy="90" r="12" fill="#fff5e6" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="80" cy="90" r="12" fill="#fff5e6" stroke="#fb7185" stroke-width="1.5"/>
  <circle cx="110" cy="90" r="12" fill="#fff5e6" stroke="#a78bfa" stroke-width="1.5"/>
  <circle cx="140" cy="90" r="12" fill="#fff5e6" stroke="#34d399" stroke-width="1.5"/>
  <circle cx="50" cy="115" r="12" fill="#fff5e6" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="80" cy="115" r="12" fill="#fff5e6" stroke="#f472b6" stroke-width="1.5"/>
  <circle cx="110" cy="115" r="12" fill="#fff5e6" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="140" cy="115" r="12" fill="#fff5e6" stroke="#fb7185" stroke-width="1.5"/>
  <!-- Party decorations -->
  <circle cx="30" cy="45" r="5" fill="#fb7185"/>
  <circle cx="50" cy="35" r="4" fill="#a78bfa"/>
  <circle cx="150" cy="40" r="5" fill="#34d399"/>
  <circle cx="170" cy="50" r="4" fill="#fbbf24"/>
  <!-- Confetti -->
  <rect x="60" y="30" width="8" height="4" rx="2" fill="#60a5fa" transform="rotate(30 64 32)"/>
  <rect x="130" y="35" width="8" height="4" rx="2" fill="#f472b6" transform="rotate(-20 134 37)"/>
  <text x="100" y="175" text-anchor="middle" font-family="Arial" font-size="10" fill="#78716c">×8 Party Pack</text>
</svg>

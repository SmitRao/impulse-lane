<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="daySide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFF7ED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#FFF7ED;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#1A1A40;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1A1A40;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowBao" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8F5E9;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#5EEAD4;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#5EEAD4;stop-opacity:0" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Split background: day/night -->
  <rect width="200" height="200" fill="url(#daySide)" rx="20"/>
  
  <!-- Day side label -->
  <text x="50" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#6B7280">DAY</text>
  
  <!-- Night side label -->
  <text x="150" y="25" text-anchor="middle" font-family="sans-serif" font-size="10" fill="#5EEAD4">NIGHT</text>
  
  <!-- Day side baos (left) - 3 -->
  <ellipse cx="35" cy="65" rx="20" ry="16" fill="url(#glowBao)"/>
  <ellipse cx="35" cy="59" rx="14" ry="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="30" cy="68" r="3" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="40" cy="66" r="2" fill="#5EEAD4" opacity="0.3"/>
  
  <ellipse cx="65" cy="100" rx="20" ry="16" fill="url(#glowBao)"/>
  <ellipse cx="65" cy="94" rx="14" ry="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="60" cy="103" r="3" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="70" cy="101" r="2" fill="#5EEAD4" opacity="0.3"/>
  
  <ellipse cx="35" cy="135" rx="20" ry="16" fill="url(#glowBao)"/>
  <ellipse cx="35" cy="129" rx="14" ry="5" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="30" cy="138" r="3" fill="#5EEAD4" opacity="0.3"/>
  <circle cx="40" cy="136" r="2" fill="#5EEAD4" opacity="0.3"/>
  
  <!-- Night side baos (right) - 3 with glow -->
  <circle cx="135" cy="65" r="25" fill="url(#glowEffect)"/>
  <ellipse cx="135" cy="65" rx="20" ry="16" fill="#2A2A5A" filter="url(#glow)"/>
  <ellipse cx="135" cy="59" rx="14" ry="5" fill="#5EEAD4" opacity="0.4"/>
  <circle cx="130" cy="68" r="3" fill="#5EEAD4" opacity="0.9"/>
  <circle cx="140" cy="66" r="2" fill="#5EEAD4" opacity="0.9"/>
  
  <circle cx="165" cy="100" r="25" fill="url(#glowEffect)"/>
  <ellipse cx="165" cy="100" rx="20" ry="16" fill="#2A2A5A" filter="url(#glow)"/>
  <ellipse cx="165" cy="94" rx="14" ry="5" fill="#5EEAD4" opacity="0.4"/>
  <circle cx="160" cy="103" r="3" fill="#5EEAD4" opacity="0.9"/>
  <circle cx="170" cy="101" r="2" fill="#5EEAD4" opacity="0.9"/>
  
  <circle cx="135" cy="135" r="25" fill="url(#glowEffect)"/>
  <ellipse cx="135" cy="135" rx="20" ry="16" fill="#2A2A5A" filter="url(#glow)"/>
  <ellipse cx="135" cy="129" rx="14" ry="5" fill="#5EEAD4" opacity="0.4"/>
  <circle cx="130" cy="138" r="3" fill="#5EEAD4" opacity="0.9"/>
  <circle cx="140" cy="136" r="2" fill="#5EEAD4" opacity="0.9"/>
  
  <!-- Stars on night side -->
  <circle cx="115" cy="40" r="1" fill="#FFFFFF" opacity="0.8"/>
  <circle cx="180" cy="55" r="1.5" fill="#FFFFFF" opacity="0.6"/>
  <circle cx="125" cy="155" r="1" fill="#FFFFFF" opacity="0.7"/>
  <circle cx="175" cy="145" r="1" fill="#FFFFFF" opacity="0.5"/>
  
  <!-- Pack label -->
  <rect x="70" y="165" width="60" height="28" rx="14" fill="#5EEAD4"/>
  <text x="100" y="184" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#1A1A1A">×6</text>
</svg>

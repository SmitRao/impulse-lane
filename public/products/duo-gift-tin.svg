  <circle cx="120" cy="140" r="10" fill="#fff5e6" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="145" cy="135" r="10" fill="#fff5e6" stroke="#f472b6" stroke-width="1.5"/>
  <!-- Gift tag -->

  </defs>
  <rect width="200" height="200" fill="url(#grad3)"/>
  <!-- Gift tin -->
  <ellipse cx="100" cy="150" rx="70" ry="20" fill="#b8956c"/>
  <rect x="30" y="70" width="140" height="80" fill="#d4a574"/>

  <text x="32" y="56" text-anchor="middle" font-family="Arial" font-size="8" fill="#ca8a04">GIFT</text>
  <text x="100" y="185" text-anchor="middle" font-family="Arial" font-size="10" fill="#78716c">2 Jumbo + 4 Mini</text>
